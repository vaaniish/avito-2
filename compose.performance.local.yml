name: avito-performance

services:
  perf-db:
    image: postgres:16-alpine
    restart: unless-stopped
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - compute_query_id=on
      - -c
      - track_io_timing=on
    environment:
      POSTGRES_USER: perf_user
      POSTGRES_PASSWORD: perf_password
      POSTGRES_DB: avito-perf
    ports:
      - 127.0.0.1:5434:5432
    volumes:
      - performance_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U perf_user -d avito-perf"]
      interval: 2s
      timeout: 3s
      retries: 30
    security_opt: [no-new-privileges:true]

volumes:
  performance_postgres:
