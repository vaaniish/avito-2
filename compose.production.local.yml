name: avito-production-like

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:?Set LOCAL_POSTGRES_USER}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?Set LOCAL_POSTGRES_PASSWORD}
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-avito_prodlike_test}
    volumes:
      - production_like_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [private]
    security_opt: [no-new-privileges:true]

  migrate:
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${LOCAL_POSTGRES_USER}:${LOCAL_POSTGRES_PASSWORD}@db:5432/${LOCAL_POSTGRES_DB:-avito_prodlike_test}?schema=public
    depends_on:
      db:
        condition: service_healthy
    networks: [private]
    restart: "no"

  backend:
    build:
      context: .
      target: backend
    restart: unless-stopped
    environment:
      NODE_ENV: staging
      PORT: 3001
      DATABASE_URL: postgresql://${LOCAL_POSTGRES_USER}:${LOCAL_POSTGRES_PASSWORD}@db:5432/${LOCAL_POSTGRES_DB:-avito_prodlike_test}?schema=public
      CORS_ALLOWED_ORIGINS: http://127.0.0.1:${LOCAL_HTTP_PORT:-8080},http://localhost:${LOCAL_HTTP_PORT:-8080}
      TRUST_PROXY: 1
      AUTH_SESSION_TTL_MS: 86400000
      AUTH_REMEMBERED_SESSION_TTL_MS: 2592000000
      AUTH_SESSION_PRUNE_INTERVAL_MS: 60000
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
      PG_POOL_IDLE_TIMEOUT_MS: 30000
      PG_POOL_CONNECTION_TIMEOUT_MS: 5000
      SHUTDOWN_TIMEOUT_MS: 10000
      METRICS_ACCESS_TOKEN: ${METRICS_ACCESS_TOKEN:-}
      IMAGE_STORAGE_DRIVER: inline
      PAYMENT_USE_LOCAL_STUB: 1
    depends_on:
      migrate:
        condition: service_completed_successfully
    read_only: true
    tmpfs: [/tmp]
    networks: [private]
    security_opt: [no-new-privileges:true]

  frontend:
    build:
      context: .
      target: frontend
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    environment:
      BACKEND_UPSTREAM: backend:3001
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - 127.0.0.1:${LOCAL_HTTP_PORT:-8080}:8080
    networks: [private, edge]
    security_opt: [no-new-privileges:true]

networks:
  private:
    internal: true
  edge:

volumes:
  production_like_postgres:
