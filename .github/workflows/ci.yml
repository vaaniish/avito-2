name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - release/**
  workflow_dispatch:

env:
  DATABASE_URL: postgresql://ci_user:ci-unique-password@127.0.0.1:5432/avito_ci_test?schema=public
  BASE_URL: http://127.0.0.1:3001
  PLAYWRIGHT_API_BASE_URL: http://127.0.0.1:3001/api
  PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
  CORS_ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
  PORT: 3001
  NODE_ENV: test
  PAYMENT_USE_LOCAL_STUB: 1
  DEMO_SEED_CONFIRM: DELETE_LOCAL_DEMO_DATA
  DADATA_USE_LOCAL_BANK_FIXTURES: 1
  HTTP_SLOW_REQUEST_MS: 1200
  PASSWORD_HASH_SALT_ROUNDS: 8

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Static quality and production preflight
        run: npm run ci:verify

  pr-gate:
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-unique-password
          POSTGRES_DB: avito_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d avito_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:demo
      - name: PR gate
        run: npm run ci:gate:pr
      - name: Upload API reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pr-gate-artifacts
          path: |
            artifacts/
            test-results/
          if-no-files-found: ignore

  main-gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: pr-gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-unique-password
          POSTGRES_DB: avito_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d avito_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:demo
      - name: Main test gate
        run: npm run ci:gate:main
      - name: Short 1000 VU harness check
        env:
          PERF_DATABASE_URL: postgresql://ci_user:ci-unique-password@127.0.0.1:5432/avito_ci_test?schema=public
          PERF_TEST_CONFIRM: RUN_LOCAL_1000_VU
          PERF_DURATION_SCALE: 0.01
          PERF_MAX_ERROR_RATE: 1
          PERF_MAX_TIMEOUT_RATE: 1
          PERF_CATALOG_P95_MS: 60000
          PERF_LOGIN_P95_MS: 60000
          PERF_LISTING_P95_MS: 60000
          PERF_CHECKOUT_P95_MS: 60000
          PERF_MODERATION_P95_MS: 60000
        run: npm run perf:1000vu
      - name: Upload browser and perf reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: main-gate-artifacts
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore

  pre-release-gate:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: main-gate
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci-unique-password
          POSTGRES_DB: avito_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci_user -d avito_ci_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate:deploy
      - run: npm run db:seed:demo
      - name: Pre-release gate
        run: npm run ci:gate:pre-release
      - name: Upload release reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-release-artifacts
          path: |
            artifacts/
            playwright-report/
            test-results/
          if-no-files-found: ignore
